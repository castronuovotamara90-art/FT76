<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Enlazamos fuentes de Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chelsea+Market&display=swap" rel="stylesheet">
<!-- Enlazamos el archivo CSS para los estilos -->
    <link rel="stylesheet" href="./css/styles.css">
    <title>Generador de Paleta de colores</title>
</head>
<body>
    <header>
        <h1>Colorfly Studio</h1>
        <p>Aquí puedes generar tu propia paleta de colores de manera aleatoria</p>
    </header>

    <main>

        <section id="generador">
         <h2>Genera tu paleta</h2>

          <div class="controles">
             <button class="boton boton--primario" id="generar">Generar Paleta</button>
             <button class="boton" id="modo">Modo oscuro</button>

             <div class="controles__campo">
                 <label class="controles__label" for="cantidad">Cantidad de colores</label>
                 <select class="select" id="cantidad">
                     <option value="6">6 colores</option>
                     <option value="8">8 colores</option>
                     <option value="9">9 colores</option>
                   </select>
                </div>
            </div>
 
         <section class="galeria" id="galeria"> </section>
        </section>
    </main>

    <footer>
        <p>Proyecto FT76 Tamara Castronuovo</p>
    </footer>

    <script src="./script.js"></script>
</body>
</html>
