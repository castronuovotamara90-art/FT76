<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Enlazamos fuentes de Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chelsea+Market&display=swap" rel="stylesheet">
    <!-- Enlazamos el archivo CSS para los estilos -->
    <link rel="stylesheet" href="./css/styles.css">
    <title>Color Factory - Generador de Paletas de Colores</title>
</head>

<body>
    <header class="header-contenedor">
        <div class="header-titulo">
            <h1>Color Factory</h1>
            <p class="subtitulo-header">Despliega tu imaginación, y da vida a tus diseños con paletas de color únicas</p>
        </div>

        <div class="header-acciones">
            <button class="boton" id="modo">Modo oscuro</button>
        </div>
    </header>


    <main>
        <!-- SECCIÓN 1: Controles de generación -->
        <section id="generador">
            <h2>Genera tu paleta</h2>
    
            <div class="controles">
                <button class="boton boton--primario" id="generar">Generar Paleta</button>
                <div class="controles__campo">
                    <label class="controles__label" for="cantidad">Cantidad de colores</label>
                    <select class="select" id="cantidad">
                        <option value="6">6 colores</option>
                        <option value="8">8 colores</option>
                        <option value="9">9 colores</option>
                    </select>
                </div>
                <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
            </div>
        </section>
    
        <!-- SECCIÓN 2: Resultados -->
        <section id="galeria-section" aria-labelledby="galeria-titulo">
            <h2 id="galeria-titulo">Paleta generada</h2>
            <div class="galeria" id="galeria" role="region" aria-label="Galería de colores generados"></div>
        </section>
    </main>

    <footer>
      <p>Proyecto <strong>FT76</strong> — Desarrollado por Tamara Castronuovo</p>
      <small>&copy; 2026 Tamara Castronuovo. Todos los derechos reservados.</small>
    </footer>

    <script src="./script.js"></script>
</body>

</html>
